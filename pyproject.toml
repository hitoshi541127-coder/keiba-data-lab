[project]
name = "keiba-data-lab"
version = "0.2.0"
description = "Stable Scrapy pipeline for collecting and converting Japanese horse racing data"
requires-python = ">=3.8"
dependencies = [
    "scrapy>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
