name: Collect Keiba Data

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect sample
        run: |
          scrapy crawl netkeiba -O sample.json -a max_pages=1 -a max_races=50す

      - name: Convert to CSV
        run: |
          python netkeiba_python/jsontocsv.py -i sample.json -o sample.csv

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: keiba-sample
          path: |
            sample.json
            sample.csv
      - name: Debug netkeiba response
        run: |
          python - <<'PY'
          import requests

          url = "https://db.netkeiba.com/?pid=race_top"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          }

          r = requests.get(url, headers=headers, timeout=30)

          print("STATUS:", r.status_code)
          print("URL:", r.url)
          print("LENGTH:", len(r.content))
          print("----- RESPONSE -----")
          print(r.text[:2000])

          with open("debug_response.html", "w", encoding="utf-8") as f:
              f.write(r.text)
          PY
